# Automatically load subtitles with similar filenames
sub-auto=fuzzy

# Specify preferred subtitle languages (e.g., English)
slang=en

# Search for subtitles in the current directory and additional paths
sub-file-paths=~/SpotifyPlaylists/

# Subtitle appearance
sub-font-size=40          # Adjust the font size
sub-pos=90                # Position subtitles (percentage of screen height)
sub-color=1/1/1          # Set subtitle color (white)
sub-border-size=2         # Add a border around subtitles

# Handle subtitle encoding (useful for non-UTF-8 subtitles)
sub-codepage=utf8         # Common for modern subtitles

# Video and performance tweaks (optional, but recommended)
vo=gpu                    # Use GPU video output for better performance
hwdec=auto                # Enable hardware decoding

