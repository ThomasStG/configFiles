toggle_hotkey = "SHIFT+ALT+SPACE"
clipboard_hotkey = "SUPER+SHIFT+C"
event_duration = 60
main_page = "frequentlyused"
start_at_login = true
placeholder = ""
search_url = "https://google.com/search?q=%s"
haptic_feedback = false
cbhist = true
show_trayicon = true
search_dirs = ["~"]
log_path = "/tmp/rustcast.log"
debounce_delay = 300
auto_update = true

[buffer_rules]
clear_on_hide = true
clear_on_enter = true

[theme]
text_color = [
    0.95,
    0.95,
    0.96,
]
background_color = [
    0.04,
    0.08,
    0.15,
]
blur = false
show_icons = true
show_scroll_bar = true
font = "Hack Nerd Font"

[[shells]]
command = '''osascript -e 'tell application \"Spotify\" to play next track''''
icon_path = "/Applications/Spotify.app/Contents/Resources/AppIcon.icns"
alias = "Next Spotify Song"
alias_lc = "next"

[modes]

[aliases]
gh = "ghostty"
ss = "System Settings"
